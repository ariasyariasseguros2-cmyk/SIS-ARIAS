
<div class="container-fluid p-0">
    <div class="mb-3">
        <a href="#" class="text-decoration-none text-secondary" data-bs-dismiss="modal">
            <i class="bi bi-chevron-left"></i> Volver al listado Avisos - Documentos
        </a>
    </div>

    <div class="card shadow-sm avisos-edit-card">
        
        <div class="card-body">
            <form id="editAvisosForm">
                <input type="hidden" name="id" value="{{ prima.idPoliza }}">
                
                <div class="row mb-4 align-items-center">
                    <label class="col-md-3 col-form-label text-end fw-bold">Aviso Cob <span class="text-danger">*</span></label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" value="{{ prima.recibo or prima.aviso or '' }}" readonly>
                    </div>
                </div>

                <div class="row mb-4">
                    <label class="col-md-3 col-form-label text-end fw-bold">Documento <span class="text-danger">*</span></label>
                    <div class="col-md-9">
                        {% if documents %}
                            {% for doc in documents %}
                            <div class="mb-2 d-flex align-items-center gap-2 flex-wrap">
                                <button type="button" class="btn btn-sm avisos-edit-btn-view btn-preview" data-url="{{ doc.url }}" data-name="{{ doc.name }}">
                                    <i class="bi bi-eye me-1"></i> Ver
                                </button>
                                <button type="button" class="btn btn-sm avisos-edit-btn-danger btn-delete-document" data-archivo-id="{{ doc.idArchivo }}">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                                <span class="small text-muted text-truncate" style="max-width: 420px;">{{ doc.name }}</span>
                            </div>
                            {% endfor %}
                            <div class="form-text mt-2 text-muted fst-italic">
                                * Si quieres subir otro fichero, antes elimina el fichero origen.
                            </div>
                        {% else %}
                            <input class="form-control" type="file" name="documento">
                            <div class="form-text">Seleccionar archivo</div>
                        {% endif %}
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-4 avisos-edit-actions">
                    <button type="button" class="btn avisos-edit-btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-chevron-left"></i> Volver
                    </button>
                    <button type="button" class="btn avisos-edit-btn-success" id="btnGuardarAviso">
                        <i class="bi bi-check-circle me-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
