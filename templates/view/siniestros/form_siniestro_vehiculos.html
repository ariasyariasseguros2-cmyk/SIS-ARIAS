<!-- Formulario de Siniestro para VEHICULOS con Acordeón -->
<input type="hidden" id="grupoRamo" value="VEHICULOS">

<div class="accordion" id="accordionVehiculos">

    <!-- SECCIÓN 1: INFORMACIÓN BÁSICA -->
    <div class="accordion-item">
        <h2 class="accordion-header" id="headingInfoBasica">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInfoBasica" aria-expanded="true" aria-controls="collapseInfoBasica">
                <i class="bi bi-info-circle me-2"></i> INFORMACIÓN BÁSICA DE LA PÓLIZA
            </button>
        </h2>
        <div id="collapseInfoBasica" class="accordion-collapse collapse show" aria-labelledby="headingInfoBasica" data-bs-parent="#accordionVehiculos">
            <div class="accordion-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="poliza" class="form-label">Póliza *</label>
                        <input type="text" class="form-control" id="poliza" readonly required>
                    </div>
                    <div class="col-md-4">
                        <label for="cia" class="form-label">Compañía *</label>
                        <input type="text" class="form-control" id="cia" required>
                    </div>
                    <div class="col-md-4">
                        <label for="ramo" class="form-label">Ramo</label>
                        <input type="text" class="form-control" id="ramo">
                    </div>
                    <div class="col-md-6">
                        <label for="contratante" class="form-label">Contratante *</label>
                        <input type="text" class="form-control" id="contratante" required>
                    </div>
                    <div class="col-md-6">
                        <label for="asegurado" class="form-label">Asegurado *</label>
                        <input type="text" class="form-control" id="asegurado" required>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN 2: DATOS DEL SINIESTRO -->

        <h2 class="accordion-header" id="headingSiniestro">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSiniestro" aria-expanded="false" aria-controls="collapseSiniestro">
                <i class="bi bi-car-front me-2"></i> DATOS DEL SINIESTRO VEHICULAR
            </button>
        </h2>
        <div id="collapseSiniestro" class="accordion-collapse collapse" aria-labelledby="headingSiniestro" data-bs-parent="#accordionVehiculos">

                    <div class="col-md-4">

                        <input type="date" class="form-control" id="fecNotificacionBroker">

                    <div class="col-md-4">
                        <label for="fecStro" class="form-label">Fecha de Siniestro *</label>
                        <input type="date" class="form-control" id="fecStro" required>
                    </div>
                    <div class="col-md-4">
                        <label for="horaSiniestro" class="form-label">Hora Siniestro</label>
                        <input type="text" class="form-control" id="horaSiniestro" placeholder="7:50 AM">

                    <div class="col-md-4">
                        <label for="quienReporta" class="form-label">Quien reporta</label>
                        <input type="text" class="form-control" id="quienReporta">

                        <input type="email" class="form-control" id="email">

                    <div class="col-md-4">
                        <label for="telefonos" class="form-label">Teléfonos</label>

                    </div>

                        <input type="text" class="form-control" id="horaCulminacion">

                    <div class="col-md-4">

                        <select class="form-select" id="tipoAtencion">
                            <option value="">Seleccionar...</option>
                            <option value="URGENTE">URGENTE</option>
                            <option value="NORMAL">NORMAL</option>
                            <option value="SEGUIMIENTO">SEGUIMIENTO</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label for="lugarSiniestro" class="form-label">Lugar Siniestro</label>
                        <textarea class="form-control" id="lugarSiniestro" rows="2"></textarea>
                    </div>
                    <div class="col-md-12">
                        <label for="causa" class="form-label">Causa</label>
                        <textarea class="form-control" id="causa" rows="2"></textarea>
                    </div>
                    <div class="col-md-4">
                        <label for="fecPresentacionCia" class="form-label">Fecha Presentación Compañía</label>
                        <input type="date" class="form-control" id="fecPresentacionCia">

                    <div class="col-md-4">
                        <label for="siniestroNo" class="form-label">Número de Siniestro</label>
                        <input type="text" class="form-control" id="siniestroNo">

                    <div class="col-md-4">
                        <label for="ejecutivoCia" class="form-label">Ejecutivo de la Compañía</label>
                        <input type="text" class="form-control" id="ejecutivoCia">
                    </div>
                    <div class="col-md-6">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado">
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="EN_PROCESO">EN PROCESO</option>
                            <option value="LIQUIDADO">LIQUIDADO</option>
                            <option value="PAGADO">PAGADO</option>
                            <option value="CERRADO">CERRADO</option>
                            <option value="RECHAZADO">RECHAZADO</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="situacion" class="form-label">Situación</label>
                        <select class="form-select" id="situacion">
                            <option value="">Seleccionar...</option>
                            <option value="ROBO_TOTAL">ROBO TOTAL</option>
                            <option value="CHOQUE">CHOQUE</option>
                            <option value="VOLCADURA">VOLCADURA</option>
                            <option value="INCENDIO">INCENDIO</option>
                            <option value="TERCEROS">TERCEROS</option>
                            <option value="OTROS">OTROS</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN 3: DATOS DEL VEHÍCULO -->

        <h2 class="accordion-header" id="headingVehiculo">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseVehiculo" aria-expanded="false" aria-controls="collapseVehiculo">
                <i class="bi bi-car-front-fill me-2"></i> DATOS DEL VEHÍCULO
            </button>
        </h2>
        <div id="collapseVehiculo" class="accordion-collapse collapse" aria-labelledby="headingVehiculo" data-bs-parent="#accordionVehiculos">
            <div class="accordion-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="vehiculoPlaca" class="form-label">Placa *</label>
                        <input type="text" class="form-control text-uppercase" id="vehiculoPlaca" required>
                    </div>
                    <div class="col-md-3">
                        <label for="vehiculoMarca" class="form-label">Marca</label>
                        <input type="text" class="form-control" id="vehiculoMarca">
                    </div>
                    <div class="col-md-3">
                        <label for="vehiculoModelo" class="form-label">Modelo</label>
                        <input type="text" class="form-control" id="vehiculoModelo">
                    </div>
                    <div class="col-md-3">

                        <input type="text" class="form-control" id="vehiculoAnio">
                    </div>
                    <div class="col-md-4">

                        <input type="text" class="form-control" id="vehiculoMotor">
                    </div>

                    </div>
                    <div class="col-md-6">
                        <label for="vehiculoTaller" class="form-label">Taller</label>
                        <input type="text" class="form-control" id="vehiculoTaller">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN 4: DATOS DE LA DENUNCIA -->
    <div class="accordion-item">
        <h2 class="accordion-header" id="headingDenuncia">

                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="denunciaDepartamento" class="form-label">Departamento</label>
                        <input type="text" class="form-control" id="denunciaDepartamento">
                    </div>
                    <div class="col-md-3">
                        <label for="denunciaProvincia" class="form-label">Provincia</label>
                        <input type="text" class="form-control" id="denunciaProvincia">
                    </div>
                    <div class="col-md-3">
                        <label for="denunciaDistrito" class="form-label">Distrito</label>
                        <input type="text" class="form-control" id="denunciaDistrito">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN 5: DATOS DEL CONDUCTOR -->

        <h2 class="accordion-header" id="headingConductor">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseConductor" aria-expanded="false" aria-controls="collapseConductor">

        </h2>
        <div id="collapseConductor" class="accordion-collapse collapse" aria-labelledby="headingConductor" data-bs-parent="#accordionVehiculos">

                <div class="row g-3">
                    <div class="col-md-6">

                    </div>

                    <div class="col-md-3">
