<div class="modal fade" id="addClienteModal" tabindex="-1" aria-labelledby="addClienteModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <form id="addClienteForm" autocomplete="off" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="addClienteModalLabel">
            <i class="bi-person-plus me-1"></i> Añadir Clientes
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          
          <!-- Navegación "Volver" discreta -->
          <div class="mb-4">
            <a href="#" class="text-decoration-none text-muted small fw-bold" data-bs-dismiss="modal">
              <i class="bi-arrow-left"></i> Volver al listado
            </a>
          </div>

          <!-- SECCIÓN 1: IDENTIFICACIÓN Y DATOS PRINCIPALES -->
          <div class="mb-5">
            <h6 class="section-title text-primary"><i class="bi-person-badge me-2"></i> Datos de Identificación</h6>
            <div class="section-box">
              <div class="row g-4">
                <!-- Tipo Persona & Razón Social -->
                <div class="col-md-4">
                  <label for="tipoPersona" class="form-label">Tipo de Persona <span class="text-danger">*</span></label>
                  <select id="tipoPersona" name="tipoPersona" class="form-select" required>
                    <option value="NATURAL" selected>NATURAL</option>
                    <option value="JURIDICA">JURÍDICA</option>
                  </select>
                </div>
                <div class="col-md-8">
                  <label for="razonSocial" class="form-label">Razón Social / Nombres y Apellidos <span class="text-danger">*</span></label>
                  <input type="text" id="razonSocial" name="razonSocial" class="form-control" placeholder="Ej. Juan Pérez / Empresa S.A.C." required />
                </div>

                <!-- Documento de Identidad -->
                <div class="col-12">
                  <label class="form-label d-block mb-2">Documento de Identidad <span class="text-danger">*</span></label>
                  <div class="d-flex flex-wrap align-items-center gap-3 p-3 bg-light rounded-3 border">
                    <div class="radio-group">
                      <div class="form-check form-check-inline m-0">
                        <input class="form-check-input" type="radio" name="tipoDocumento" id="docDNI" value="DNI/CE" checked required>
                        <label class="form-check-label" for="docDNI">DNI/CÉDULA</label>
                      </div>
                      <div class="form-check form-check-inline m-0">
                        <input class="form-check-input" type="radio" name="tipoDocumento" id="docRUC" value="RUC">
                        <label class="form-check-label" for="docRUC">RUC</label>
                      </div>
                      <div class="form-check form-check-inline m-0">
                        <input class="form-check-input" type="radio" name="tipoDocumento" id="docCEX" value="CEX">
                        <label class="form-check-label" for="docCEX">CEX</label>
                      </div>
                      <div class="form-check form-check-inline m-0">
                        <input class="form-check-input" type="radio" name="tipoDocumento" id="docPAS" value="PAS">
                        <label class="form-check-label" for="docPAS">PAS</label>
                      </div>
                    </div>
                    <div class="vr mx-2 d-none d-md-block"></div>
                    <div class="flex-grow-1" style="min-width: 200px;">
                      <input type="text" id="numeroDocumento" name="numeroDocumento" class="form-control border-0 bg-white shadow-sm" placeholder="Número de Documento" required />
                    </div>
                  </div>
                  <div class="form-text mt-1 small ms-1"><i class="bi-info-circle"></i> CEX: Carnet de Extranjería - PAS: Pasaporte</div>
                </div>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 2: UBICACIÓN Y CONTACTO -->
          <div class="mb-5">
            <h6 class="section-title text-primary"><i class="bi-geo-alt me-2"></i> Ubicación y Contacto</h6>
            <div class="section-box">
              <div class="row g-4">
                <!-- Dirección Completa -->
                <div class="col-12">
                  <label for="direccion" class="form-label">Dirección Fiscal / Domicilio <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-house"></i></span>
                    <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Av. Principal 123, Of. 401" required />
                  </div>
                </div>

                <!-- Ubicación Geográfica -->
                <div class="col-md-4">
                  <label for="departamento" class="form-label">Departamento <span class="text-danger">*</span></label>
                  <input type="text" id="departamento" name="departamento" class="form-control" value="LIMA" required />
                </div>
                <div class="col-md-4">
                  <label for="provincia" class="form-label">Provincia <span class="text-danger">*</span></label>
                  <input type="text" id="provincia" name="provincia" class="form-control" value="LIMA" required />
                </div>
                <div class="col-md-4">
                  <label for="distrito" class="form-label">Distrito <span class="text-danger">*</span></label>
                  <input type="text" id="distrito" name="distrito" class="form-control" placeholder="Ej. Miraflores" required />
                </div>

                <div class="col-12"><hr class="text-muted opacity-25 my-0"></div>

                <!-- Datos de Contacto -->
                <div class="col-md-6">
                  <label for="email" class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-envelope-at"></i></span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="cliente@ejemplo.com" required />
                  </div>
                </div>
                <div class="col-md-3">
                  <label for="telefono1" class="form-label">Celular Principal <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-phone"></i></span>
                    <input type="text" id="telefono1" name="telefono1" class="form-control" placeholder="999 999 999" required />
                  </div>
                </div>
                <div class="col-md-3">
                  <label for="telefono2" class="form-label">Teléfono Secundario</label>
                  <input type="text" id="telefono2" name="telefono2" class="form-control" placeholder="Opcional" />
                </div>

                <!-- Notificaciones -->
                <div class="col-12 bg-light p-3 rounded-3 border d-flex align-items-center justify-content-between">
                  <div>
                    <label class="form-label mb-0 fw-bold text-dark">¿Desea recibir notificaciones automáticas?</label>
                    <div class="small text-muted">Alertas de vencimientos, pagos y renovaciones.</div>
                  </div>
                  <div class="d-flex gap-4">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="notif" id="notifSi" value="SI" checked required>
                      <label class="form-check-label fw-bold text-success" for="notifSi">SÍ</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="notif" id="notifNo" value="NO">
                      <label class="form-check-label fw-bold text-secondary" for="notifNo">NO</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 3: PERFIL Y CLASIFICACIÓN -->
          <div class="mb-5">
            <h6 class="section-title text-primary"><i class="bi-briefcase me-2"></i> Perfil y Clasificación</h6>
            <div class="section-box">
              <div class="row g-4">
                <!-- Profesión y Fechas -->
                <div class="col-md-6">
                  <label for="profesion" class="form-label">Profesión / Ocupación</label>
                  <input type="text" id="profesion" name="profesion" class="form-control" />
                </div>
                <div class="col-md-3">
                  <label for="fechaIngreso" class="form-label">Fecha Ingreso</label>
                  <input type="date" id="fechaIngreso" name="fechaIngreso" class="form-control" />
                </div>
                <div class="col-md-3">
                  <label for="cumpleanios" class="form-label">Cumpleaños/Aniversario</label>
                  <input type="date" id="cumpleanios" name="cumpleanios" class="form-control" />
                </div>

                <!-- Licencia de Conducir -->
                <div class="col-md-6">
                  <label for="licenciaConducir" class="form-label">Licencia de Conducir</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-car-front"></i></span>
                    <input type="text" id="licenciaConducir" name="licenciaConducir" class="form-control" placeholder="N° Licencia" />
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="vencimientoLicencia" class="form-label">Vencimiento Licencia</label>
                  <input type="date" id="vencimientoLicencia" name="vencimientoLicencia" class="form-control" />
                </div>

                <div class="col-12"><hr class="text-muted opacity-25 my-0"></div>

                <!-- Clasificación Comercial -->
                <div class="col-md-4">
                  <label for="subAgente" class="form-label">Sub Agente / Vendedor <span class="text-danger">*</span></label>
                  <select id="subAgente" name="subAgente" class="form-select" required>
                    <option value="">Seleccionar...</option>
                    <option value="AAS">AAS</option>
                    <option value="ARAS Y ARAS">ARAS Y ARAS</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="grupoEconomico" class="form-label">Grupo Económico</label>
                  <select id="grupoEconomico" name="grupoEconomico" class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="GRUPO A">GRUPO A</option>
                    <option value="GRUPO B">GRUPO B</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="giroNegocio" class="form-label">Giro del Negocio</label>
                  <select id="giroNegocio" name="giroNegocio" class="form-select">
                    <option value="">Seleccionar...</option>
                    <option value="COMERCIO">Comercio</option>
                    <option value="SERVICIOS">Servicios</option>
                    <option value="INDUSTRIA">Industria</option>
                  </select>
                </div>
                
                <!-- Referencias -->
                <div class="col-md-6">
                  <label for="referencia" class="form-label">Referencia (¿De dónde lo conoces?)</label>
                  <input type="text" id="referencia" name="referencia" class="form-control" />
                </div>
                <div class="col-md-6">
                  <label for="recomendadoPor" class="form-label">Recomendado Por</label>
                  <input type="text" id="recomendadoPor" name="recomendadoPor" class="form-control" />
                </div>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 4: PERSONA DE CONTACTO -->
          <div class="mb-5">
            <h6 class="section-title text-primary"><i class="bi-person-rolodex me-2"></i> Persona de Contacto (Emergencia/Secundario)</h6>
            <div class="section-box bg-light-subtle">
              <div class="row g-4">
                <div class="col-md-4">
                  <label for="contactoNombre" class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                  <input type="text" id="contactoNombre" name="contactoNombre" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label for="contactoEmail" class="form-label">Email de Contacto <span class="text-danger">*</span></label>
                  <input type="email" id="contactoEmail" name="contactoEmail" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label for="contactoTelefono" class="form-label">Teléfono de Contacto <span class="text-danger">*</span></label>
                  <input type="text" id="contactoTelefono" name="contactoTelefono" class="form-control" required />
                </div>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 5: INFORMACIÓN ADICIONAL (Tabs o Acordeón para limpiar vista) -->
          <div class="mb-3">
            <div class="accordion" id="accordionExtras">
              <!-- Item Siniestralidad -->
              <div class="accordion-item border-0 shadow-sm mb-3 rounded-3 overflow-hidden">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed fw-bold bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSiniestros">
                    <i class="bi-clipboard-pulse me-2 text-danger"></i> Informe de Siniestralidad
                  </button>
                </h2>
                <div id="collapseSiniestros" class="accordion-collapse collapse" data-bs-parent="#accordionExtras">
                  <div class="accordion-body bg-white">
                    <div class="row g-4">
                      <div class="col-md-4">
                        <label for="siniestrosReportados" class="form-label">Cantidad Reportados</label>
                        <input type="number" id="siniestrosReportados" name="siniestrosReportados" min="0" class="form-control" />
                      </div>
                      <div class="col-md-4">
                        <label for="ultimoSiniestro" class="form-label">Fecha Último Siniestro</label>
                        <input type="date" id="ultimoSiniestro" name="ultimoSiniestro" class="form-control" />
                      </div>
                      <div class="col-12">
                        <label for="detalleSiniestros" class="form-label">Detalle / Observaciones</label>
                        <textarea id="detalleSiniestros" name="detalleSiniestros" class="form-control" rows="2"></textarea>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Item Datos Interés -->
              <div class="accordion-item border-0 shadow-sm mb-3 rounded-3 overflow-hidden">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed fw-bold bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInteres">
                    <i class="bi-star me-2 text-warning"></i> Datos de Interés y Preferencias
                  </button>
                </h2>
                <div id="collapseInteres" class="accordion-collapse collapse" data-bs-parent="#accordionExtras">
                  <div class="accordion-body bg-white">
                    <div class="row g-4">
                      <div class="col-md-6">
                        <label for="referenciasInteres" class="form-label">Referencias Personales</label>
                        <input type="text" id="referenciasInteres" name="referenciasInteres" class="form-control" />
                      </div>
                      <div class="col-md-6">
                        <label for="preferencias" class="form-label">Preferencias de Servicio</label>
                        <input type="text" id="preferencias" name="preferencias" class="form-control" />
                      </div>
                      <div class="col-12">
                        <label for="notasInteres" class="form-label">Notas Generales</label>
                        <textarea id="notasInteres" name="notasInteres" class="form-control" rows="2"></textarea>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Item Más Info -->
              <div class="accordion-item border-0 shadow-sm rounded-3 overflow-hidden">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed fw-bold bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMasInfo">
                    <i class="bi-file-text me-2 text-info"></i> Información Adicional
                  </button>
                </h2>
                <div id="collapseMasInfo" class="accordion-collapse collapse" data-bs-parent="#accordionExtras">
                  <div class="accordion-body bg-white">
                    <label for="masInformacion" class="form-label visually-hidden">Más Información</label>
                    <textarea id="masInformacion" name="masInformacion" class="form-control" rows="4" placeholder="Escriba aquí cualquier otra información relevante..."></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Volver</button>
          <button type="button" class="btn btn-success" id="btnGuardarYAgregarOtro">Guardar y Añadir otro</button>
          <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
