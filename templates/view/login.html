<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Iniciar Sesion | AAS-NET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-card" aria-labelledby="login-title">
            <a class="login-brand" href="{{ url_for('index') }}" aria-label="Ir al inicio">
                <img src="{{ url_for('static', filename='img/logo-aasnet-cropped.png') }}" alt="Logo AAS-NET" />
            </a>

            <h1 id="login-title">Iniciar Sesion</h1>
            <p class="login-subtitle">Ingresa tus credenciales para acceder al sistema.</p>

            <form method="post" action="{{ url_for('login') }}" class="login-form" novalidate>
                <div class="form-field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required />
                </div>

                <div class="form-field">
                    <label for="password">Contrasena</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required />
                </div>

                {% if error %}
                    <div class="error" role="alert">{{ error }}</div>
                {% endif %}

                <div class="form-actions">
                    <button type="submit">Entrar</button>
                    <a class="btn-exit" href="{{ url_for('index') }}">Volver</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
