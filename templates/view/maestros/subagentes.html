{% extends 'view/layout_dashboard.html' %}
{% block content %}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Sub Agentes</h4>
  </div>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
       <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Abreviación</th>
          </tr>
       </thead>
       <tbody>
         {% for s in rows or [] %}
          <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.nombre }}</td>
            <td>{{ s.abreviacion }}</td>
          </tr>
         {% endfor %}
         {% if not rows or rows|length == 0 %}
          <tr><td colspan="3" class="text-center text-muted">Sin datos</td></tr>
         {% endif %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
