<link rel="stylesheet" href="{{ url_for('static', filename='css/renovar-poliza.css') }}">

<!-- Modal: Renovar Póliza -->
<div class="modal fade modal-renovar" id="renovarPolizaModal" tabindex="-1" aria-labelledby="renovarPolizaLabel" aria-hidden="true" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="renovarPolizaLabel" class="modal-title">Renovar Póliza</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <form id="renovarPolizaForm" autocomplete="off">
          <div class="container-fluid">
            <div class="row g-3">
              <!-- Columna izquierda -->
              <div class="col-md-6">
                <div class="renovar-panel">
                <div class="mb-3">
                  <label for="companiaSelect" class="form-label">Compañía</label>
                  <select id="companiaSelect" class="form-select">
                    <!-- Opciones cargadas dinámicamente desde /api/aseguradoras -->
                    <option value="">Cargando aseguradoras…</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="productoSelect" class="form-label">Producto</label>
                  <select id="productoSelect" class="form-select">
                    <option>SALUD</option>
                    <option>VIDA</option>
                    <option>PENSIÓN</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="polizaInput" class="form-label">Póliza / Certf</label>
                  <input id="polizaInput" type="text" class="form-control" placeholder="N° póliza o certificado" value="974596">
                </div>

                <div class="mb-3">
                  <label for="vigFinInput" class="form-label">Vigencia Fin</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-calendar3"></i></span>
                    <input id="vigFinInput" type="text" class="form-control" placeholder="dd/mm/aaaa" value="10/01/2026">
                  </div>
                </div>
                </div>
              </div>

              <!-- Columna derecha -->
              <div class="col-md-6">
                <div class="renovar-panel">
                <div class="mb-3">
                  <label for="ramoInput" class="form-label">Ramo</label>
                  <input id="ramoInput" type="text" class="form-control" value="SCTR" readonly>
                </div>

                <div class="mb-3">
                  <label for="tipoVigenciaSelect" class="form-label">Tipo de Vigencia</label>
                  <select id="tipoVigenciaSelect" class="form-select">
                    <option>DECLARACION MENSUAL</option>
                    <option>ANUAL</option>
                    <option>MENSUAL</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="vigInicioInput" class="form-label">Vigencia Inicio</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-calendar3"></i></span>
                    <input id="vigInicioInput" type="text" class="form-control" placeholder="dd/mm/aaaa" value="11/12/2025">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="fechaEmisionInput" class="form-label">Fecha Emisión</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi-calendar3"></i></span>
                    <input id="fechaEmisionInput" type="text" class="form-control" placeholder="dd/mm/aaaa">
                  </div>
                </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button id="btnRenovarPoliza" type="button" class="btn btn-success">Renovar</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
