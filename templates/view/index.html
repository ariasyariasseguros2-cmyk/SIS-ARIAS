<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Panel | SIS-ARIAS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @media print {
            #acciones, #uploadSection { display: none; }
            .table { border: 1px solid #444; }
            .table th, .table td { border: 1px solid #444 !important; }
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">SIS-ARIAS</span>
            <div class="d-flex">
                <a class="btn btn-outline-light" href="{{ url_for('logout') }}">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 m-0">Listado</h1>
            <div id="acciones" class="d-flex gap-2">
                <button id="exportPdfBtn" class="btn btn-secondary">Exportar PDF</button>
            </div>
        </div>

        <div class="card mb-4" id="uploadSection">
            <div class="card-body">
                <h2 class="h6">Subir archivo</h2>
                <div class="row g-2 align-items-center">
                    <div class="col-sm-8">
                        <input id="fileInput" type="file" class="form-control" />
                    </div>
                    <div class="col-sm-4">
                        <button id="uploadBtn" class="btn btn-primary w-100">Subir</button>
                    </div>
                </div>
                <div id="uploadStatus" class="text-muted mt-2"></div>
            </div>
        </div>

        <div class="card mb-4 d-none" id="extractedDataSection">
            <div class="card-body">
                <h2 class="h6">Datos extraídos del PDF</h2>
                <table class="table table-sm">
                    <tbody>
                        <tr><th>Póliza N°</th><td id="valPoliza">-</td></tr>
                        <tr><th>Ramo</th><td id="valRamo">-</td></tr>
                        <tr><th>Vigencia desde</th><td id="valVigencia">-</td></tr>
                        <tr><th>Vigencia hasta</th><td id="valVigenciaHasta">-</td></tr>
                        <tr><th>Sede(s)</th><td id="valSede">-</td></tr>
                        <tr><th>Contratante</th><td id="valContratante">-</td></tr>
                        <tr><th>Dirección</th><td id="valDireccion">-</td></tr>
                        <tr><th>Código SBS</th><td id="valCodigoSbs">-</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for r in rows %}
                        <tr>
                            <td>{{ r.id }}</td>
                            <td>{{ r.nombre }}</td>
                            <td>{{ r.estado }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
