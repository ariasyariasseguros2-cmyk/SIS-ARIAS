<!-- Modal para ver PDF de la póliza -->
<div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="pdfModalLabel" class="modal-title">Vista de PDF</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body p-0">
        <iframe id="pdfFrame" src="about:blank" style="width:100%; min-height:75vh;" title="Póliza PDF"></iframe>
      </div>
      <div class="modal-footer">
        <a id="pdfOpenNewTab" class="btn btn-outline-secondary" href="#" target="_blank" rel="noopener">Abrir en nueva pestaña</a>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
